name: CI

# Проверка каждой сборки: тесты движка блокировки, хранилищ, паролей,
# целостности проекта и синтаксиса всех JS-файлов.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Тесты (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Иконки (проверка генератора)
        run: npm run icon

      - name: Тесты
        run: npm test
