<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'" />
  <title>Разрешение сайта</title>
  <style>
    :root { --bg:#14161a; --card:#1d2128; --border:#303642; --text:#f1f3f7; --dim:#9aa3b2; --accent:#ff7a29; --green:#46c07a; --red:#ef5a5a; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; background:var(--bg); color:var(--text); font:14px "Segoe UI",system-ui,sans-serif; }
    body { display:flex; align-items:center; justify-content:center; }
    .card { width:100%; height:100%; padding:30px 32px 24px; background:linear-gradient(145deg,#222731,#181b20); border:1px solid #3a414d; border-radius:16px; box-shadow:0 18px 50px #0008; }
    .icon { width:50px; height:50px; display:grid; place-items:center; border-radius:15px; background:#ff7a2922; color:var(--accent); font-size:26px; margin-bottom:16px; }
    h1 { font-size:20px; margin:0 0 8px; } .site { color:var(--accent); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:390px; }
    p { color:var(--dim); line-height:1.45; margin:0 0 20px; } .permissions { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 22px; }
    .permission { padding:7px 11px; border:1px solid var(--border); border-radius:9px; background:#ffffff08; }
    .actions { display:flex; gap:9px; justify-content:flex-end; } button { border:0; border-radius:9px; padding:10px 13px; color:var(--text); font:600 13px inherit; cursor:pointer; }
    button:hover { filter:brightness(1.12); transform:translateY(-1px); } .deny { background:#ffffff10; border:1px solid var(--border); } .once { background:var(--accent); color:#17191e; } .always { background:var(--green); color:#102118; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🎙</div>
    <h1><span id="site">Сайт</span> запрашивает доступ</h1>
    <p>Разрешить этому сайту использовать выбранные устройства? Доступ «на этот раз» исчезнет после закрытия вкладки.</p>
    <div class="permissions" id="permissions"></div>
    <div class="actions">
      <button class="deny" data-decision="deny">Запретить</button>
      <button class="once" data-decision="once">Разрешить на этот раз</button>
      <button class="always" data-decision="always">Разрешить всегда</button>
    </div>
  </main>
  <script>
    const labels = { microphone: '🎙 Микрофон', camera: '📷 Камера', geolocation: '📍 Геолокация' };
    let requestId = '';
    window.kitsunePermission.onShow((data) => {
      requestId = data.id;
      document.getElementById('site').textContent = data.site;
      document.getElementById('permissions').replaceChildren(...data.permissions.map((name) => { const el = document.createElement('span'); el.className = 'permission'; el.textContent = labels[name] || name; return el; }));
    });
    document.querySelectorAll('button[data-decision]').forEach((button) => button.addEventListener('click', () => window.kitsunePermission.decide(requestId, button.dataset.decision)));
  </script>
</body>
</html>
