<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'" />
  <title>Новая вкладка — Kitsune Browser</title>
  <link rel="stylesheet" href="internal.css" />
  <style>
    .home { max-width: 660px; margin: 0 auto; padding: 12vh 24px 40px; text-align: center; }
    .home-logo { width: 92px; height: 92px; margin-bottom: 12px; color: var(--accent); }
    .home-logo path, .home-logo circle { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
    .home-name { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 6px; }
    .home-tag { color: var(--text-dim); font-size: 14px; margin: 0 0 32px; }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 50px;
      padding: 0 16px;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 25px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .search-box svg { width: 18px; height: 18px; flex: 0 0 18px; color: var(--text-dim); }
    .search-box input {
      flex: 1 1 auto;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      min-width: 0;
    }
    .search-actions { margin-top: 14px; display: flex; gap: 10px; justify-content: center; }

    .shortcuts { margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(94px, 1fr)); gap: 12px; }
    .shortcut {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 14px 6px;
      border-radius: 12px;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      cursor: pointer;
      color: var(--text);
      font-size: 11.5px;
      text-align: center;
      overflow: hidden;
    }
    .shortcut:hover { background: var(--bg-hover); border-color: var(--accent); }
    .shortcut .fav {
      width: 30px; height: 30px; border-radius: 8px;
      display: grid; place-items: center;
      background: var(--accent-soft); color: var(--accent);
      font-size: 15px; font-weight: 700; overflow: hidden;
    }
    .shortcut .fav img { width: 100%; height: 100%; object-fit: contain; }
    .shortcut .lbl { width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-dim); }

    .home-foot { margin-top: 34px; color: var(--text-dim); font-size: 12px; }
    .home-foot b { color: var(--accent); }
  </style>
</head>
<body>
  <div class="home">
    <svg class="home-logo" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M6 4 L11 11 L16 8 L21 11 L26 4 L26 17 C26 24 21.5 28 16 28 C10.5 28 6 24 6 17 Z" />
      <circle cx="12.5" cy="17" r="1.7" />
      <circle cx="19.5" cy="17" r="1.7" />
    </svg>
    <h1 class="home-name">Kitsune</h1>
    <p class="home-tag">Быстрый. Тихий. Без рекламы.</p>

    <form class="search-box" id="search-form">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5" /><path d="M13.2 13.2 17 17" /></svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Поиск в DuckDuckGo" />
    </form>

    <div class="search-actions">
      <button class="btn" id="go-search">Найти</button>
      <button class="btn ghost" id="go-lucky">Мне повезёт</button>
    </div>

    <div class="shortcuts" id="shortcuts"></div>

    <p class="home-foot" id="stats">Блокировщик рекламы активен · <b>0</b> запросов заблокировано</p>
  </div>

  <script src="internal.js"></script>
</body>
</html>
